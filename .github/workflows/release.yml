name: Release

# Đẩy tag dạng v1.0.0 → tự build, đóng gói DMG + ZIP và đăng lên GitHub Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Số phiên bản (vd 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      # Tuỳ chọn – chỉ cần khi bạn có Apple Developer ID (xem README). Không có thì app ký ad-hoc.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài cmake
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Nhập chứng chỉ Developer ID (nếu có)
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build + đóng gói
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/make-dmg.sh

      - name: Đăng lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
